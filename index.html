<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAW entwickeln</title>
<style>
:root{--bg:#161616;--bg2:#222;--fg:#e8e8e8;--mu:#999}
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--bg2)}
select{background:#333;color:var(--fg);border:1px solid #444;border-radius:6px;padding:6px 8px;font:inherit}
button,.btn{background:#333;color:var(--fg);border:1px solid #444;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover,.btn:hover{background:#3d3d3d}
main{flex:1;display:flex;min-height:0}
#st{flex:1 1 0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;min-width:0;padding:12px;position:relative}
canvas{max-width:100%;max-height:100%;box-shadow:0 0 0 1px #333;display:none}
#msg{position:absolute;color:var(--mu);text-align:center;padding:20px;background:#000a;border-radius:8px}
aside{width:300px;overflow:auto;padding:12px;background:var(--bg2)}
label.r{display:block;margin-bottom:12px}label.r span{display:flex;justify-content:space-between}
input[type=range]{width:100%}input[type=file]{display:none}
.dd{position:relative}
.menu{position:absolute;top:100%;left:0;margin-top:4px;z-index:20;min-width:270px;background:var(--bg2);border:1px solid #444;border-radius:8px;padding:6px;box-shadow:0 6px 20px #000a}
.menu[hidden]{display:none}
.menu button{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:14px;text-align:left;background:none;border:0;padding:7px 10px}
.menu button:hover{background:#3d3d3d}.menu small{color:var(--mu);font-size:11px}
.mh{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 2px}
#info{color:var(--mu);font-size:12px;margin-bottom:12px;white-space:pre-line}
#hg{display:none;max-height:none;width:100%;height:90px;margin-bottom:10px;background:#111;border-radius:4px}
.wbh{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.wbh button{padding:3px 12px;font-size:12px}.wbh button.on{background:#3b5f99;border-color:#6a8ec8}
#cu{display:block;width:100%;max-height:none;aspect-ratio:1;background:#111;border-radius:4px;touch-action:none;cursor:crosshair;margin-bottom:6px}#ch{color:var(--mu);font-size:11px;margin-bottom:12px}
.ctabs{display:flex;gap:6px;margin-bottom:8px}.ctabs button{flex:1;padding:4px 0}.ctabs button.on{background:#3b5f99;border-color:#6a8ec8}.ctabs button.mod::after{content:" •"}
#cd,#zd,#md,#cpd{margin-top:8px}#cp_l{max-height:34vh;overflow:auto;-webkit-overflow-scrolling:touch}.cpi{padding:10px 8px;border-bottom:1px solid #2f2f2f;font-size:13px;cursor:pointer}.cpi:active{background:#2a2a2a}#cd summary,#zd summary,#md summary,#cpd summary{cursor:pointer;padding:13px 12px;margin:0 0 8px;list-style:none;justify-content:flex-start;gap:10px;background:#2a2a2a;border-radius:6px;font-size:13px;-webkit-tap-highlight-color:transparent;user-select:none}#cd summary::-webkit-details-marker,#zd summary::-webkit-details-marker,#md summary::-webkit-details-marker,#cpd summary::-webkit-details-marker{display:none}#cd summary::before,#zd summary::before,#md summary::before,#cpd summary::before{content:"▸";display:inline-block;width:1em;text-align:center}#cd[open] summary::before,#zd[open] summary::before,#md[open] summary::before,#cpd[open] summary::before{content:"▾"}
#mdf{width:100%;box-sizing:border-box;margin-bottom:6px;padding:6px}#mdb{max-height:55vh;overflow:auto;font-size:12px;line-height:1.35;-webkit-overflow-scrolling:touch}#mdb table{width:100%;border-collapse:collapse;margin-bottom:8px}#mdb td{padding:2px 4px;vertical-align:top;border-bottom:1px solid #2c2c2c;word-break:break-word}#mdb td.mk{color:var(--mu);width:42%}#mdb .ms{margin:8px 0 4px;color:#9bb7e6;font-weight:600}.crow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.crow .ctabs{flex:1;margin:0}.crow #cr{padding:4px 10px;font-size:12px}
#sum{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0 0 12px}#sum b{color:var(--mu);font-weight:400}
@media(max-width:700px){main{flex-direction:column}aside{width:100%;flex:none;max-height:48%}#cu{width:min(100%,32vh);margin:0 auto 6px}#ch{text-align:center}}
</style></head><body>

'Gradationskurve':'Tone curve','Diese zurücksetzen':'Reset this one',

'Drehen':'Rotate','Winkel (frei)':'Angle (free)','Zuschnitt (Randpixel)':'Crop (edge pixels)','Links (px)':'Left (px)','Rechts (px)':'Right (px)','Oben (px)':'Top (px)','Unten (px)':'Bottom (px)',

'Kamera unbekannt':'Camera unknown','Rohdaten (Bayer)':'Raw data (Bayer)','Allgemeines Standardprofil':'Generic default profile','Rand abgeschnitten (L/R/O/U)':'Edge cropped (L/R/T/B)',

'Objektivabschattung (GainMap) korrigiert':'Lens shading (GainMap) corrected',
'Aufnahme':'Captured','Zeit / Blende':'Shutter / Aperture','Brennweite':'Focal length','Blitz':'Flash','Messung':'Metering','Fokusfeld':'Focus point','KB':'35 mm eq.',
'an (ausgelöst)':'on (fired)','aus':'off','unbekannt':'unknown','Durchschnitt':'Average','Mittenbetont':'Center-weighted','Mehrfeld-Spot':'Multi-spot','Teilmessung':'Partial','andere':'other','Nr. ':'No. ',
'Feld ':'Point ','Modus ':'Mode ','Einzelfeld':'Single point','Dynamisch':'Dynamic','Dynamisch (nächstes Objekt)':'Dynamic (closest subject)','Gruppe dynamisch':'Group dynamic','Einzelfeld (weit)':'Single point (wide)','Dynamisch (weit)':'Dynamic (wide)',
'Mitte':'Center','oben':'top','unten':'bottom','Mitte-links':'center-left','Mitte-rechts':'center-right','oben-links':'top-left','oben-rechts':'top-right','unten-links':'bottom-left','unten-rechts':'bottom-right','ganz links':'far left','ganz rechts':'far right',

'unkomprimiert':'uncompressed','JPEG (alt)':'JPEG (old)','Nikon NEF komprimiert':'Nikon NEF compressed','Verlustbehaftetes JPEG (DNG)':'Lossy JPEG (DNG)','CFA (Rohdaten)':'CFA (raw data)','90° im Uhrzeigersinn':'90° clockwise','90° gegen den Uhrzeigersinn':'90° counterclockwise',
'Verlustbehaftetes JPEG in DNG wird nicht unterstützt.':'Lossy JPEG in DNG is not supported.','Nikon-Linearisierungstabelle nicht gefunden.':'Nikon linearization table not found.',

'Keine TIFF/DNG-Datei (BigTIFF und andere RAW-Formate werden nicht unterstützt).':'Not a TIFF/DNG file (BigTIFF and other RAW formats are not supported).',
'Canon CR2 wird nicht mehr unterstützt. Bitte DNG, NEF oder TIFF verwenden.':'Canon CR2 is no longer supported. Please use DNG, NEF or TIFF.',
'Sony ARW wird nicht mehr unterstützt. Bitte DNG, NEF oder TIFF verwenden.':'Sony ARW is no longer supported. Please use DNG, NEF or TIFF.',
'Kein unterstütztes Bild gefunden (LZW/PackBits-TIFF, verlustbehaftetes DNG und NEF „High Efficiency“ werden nicht unterstützt).':'No supported image found (LZW/PackBits TIFF, lossy DNG and NEF “High Efficiency” are not supported).',
'Nur 8 und 16 Bit (unkomprimiert/Deflate) bzw. Lossless-JPEG werden unterstützt.':'Only 8 and 16 bit (uncompressed/Deflate) or lossless JPEG are supported.',
'Nikon-MakerNote nicht lesbar (nur NEF mit Nikon-Typ-3-MakerNote werden unterstützt).':'Nikon MakerNote not readable (only NEF files with a Nikon type 3 MakerNote are supported).',
'Nur 2×2-Farbfilter (Bayer) werden unterstützt.':'Only 2×2 color filters (Bayer) are supported.','Dieses Farbfilter-Muster wird nicht unterstützt.':'This color filter pattern is not supported.',
'Big-Endian-System wird nicht unterstützt.':'Big-endian systems are not supported.'};
const PAT=[[/^Bild-IFD (.*)$/,m=>'Image IFD '+m[1]],[/^(.*) … \((\d+) Bytes\)$/,m=>m[1]+' … ('+m[2]+' bytes)'],[/^(.*) … \((\d+) Werte\)$/,m=>m[1]+' … ('+m[2]+' values)'],
 [/^vorhanden \((\d+) Bytes\), Format nicht lesbar$/,m=>'present ('+m[1]+' bytes), format not readable'],[/^(\d+) – (.+)$/,m=>m[1]+' – '+T(m[2])]];
function T(s){if(LANG!='en'||typeof s!='string')return s;const v=EN[s];if(v!==undefined)return v;for(const[r,f]of PAT){const m=r.exec(s);if(m)return f(m)}return s}

const S=[['ev','Belichtung (EV)',-4,4,.05,0],['temp','Temperatur',-200,200,1,0],['tint','Tönung',-200,200,1,0],['con','Kontrast',-100,100,1,0],['hl','Lichter',-100,100,1,0],['sh','Schatten',-100,100,1,0],['sat','Sättigung',-100,100,1,0]];
const P={};let R=null,pv=null,pw=0,ph=0,pv0=null,pw0=0,ph0=0,pimg=null,name='foto',raf=0;
const ctx=$('#cv').getContext('2d');
// ---------- Histogramm (entwickelte Vorschau) ----------
const HC=$('#hg'),hx=HC.getContext('2d'),hb=new Uint32Array(768);
function hist(){const d=pimg.data,n=pw*ph,W=256,H=HC.height;hb.fill(0);
 for(let i=0,j=0;i<n;i++,j+=4){hb[d[j]]++;hb[256+d[j+1]]++;hb[512+d[j+2]]++}
 let mx=1;for(let c=0;c<3;c++)for(let i=1;i<255;i++)mx=Math.max(mx,hb[c*256+i]);
 hx.globalCompositeOperation='source-over';hx.fillStyle='#111';hx.fillRect(0,0,W,H);hx.globalCompositeOperation='lighter';
 ['rgb(220,0,0)','rgb(0,220,0)','rgb(0,0,220)'].forEach((col,c)=>{hx.fillStyle=col;for(let i=0;i<W;i++){const h=Math.min(1,Math.sqrt(hb[c*256+i]/mx))*H;hx.fillRect(i,H-h,1,h)}});
 HC.style.display='block'}
let lastMsg='';const msg=t=>{lastMsg=t;$('#msg').textContent=T(t);$('#msg').style.display=t?'':'none'};
$('aside').insertAdjacentHTML('beforeend',S.map(([k,n,a,b,s,d])=>`<label class="r"><span>${n}<b id="o_${k}">${d}</b></span><input type="range" id="s_${k}" min="${a}" max="${b}" step="${s}" value="${d}"></label>`).join(''));
function readP(){for(const[k]of S){P[k]=+$('#s_'+k).value;$('#o_'+k).textContent=P[k]}}
for(const[k,,,,,d]of S){const e=$('#s_'+k);e.oninput=()=>{readP();cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)};e.ondblclick=()=>{e.value=d;e.oninput()}}
readP();
// ---------- Weißabgleich: Pipette ----------
$('#s_temp').closest('label').insertAdjacentHTML('beforebegin','<div class="wbh"><span>Weißabgleich</span><button id="pip" title="Auf eine neutrale graue Stelle klicken">Pipette</button></div>');
let pick=false;
function setPick(on){on=!!(on&&R&&pv);pick=on;$('#pip').classList.toggle('on',on);$('#cv').style.cursor=on?'crosshair':''}
$('#pip').onclick=()=>setPick(!pick);
$('#cv').addEventListener('click',e=>{
 if(!pick)return;
 const r=e.currentTarget.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/r.width*pw),cy=Math.floor((e.clientY-r.top)/r.height*ph),s=[0,0,0];let n=0;
 for(let y=Math.max(0,cy-2);y<=Math.min(ph-1,cy+2);y++)for(let x=Math.max(0,cx-2);x<=Math.min(pw-1,cx+2);x++){const i=(y*pw+x)*3;for(let c=0;c<3;c++)s[c]+=pv[i+c];n++}
 setPick(false);if(!n)return;
 const bad=t=>{msg(t);setTimeout(()=>msg(''),2500)},m=s.map(t=>t/n);
 if(Math.min(...m)<.002)return bad('Diese Stelle ist zu dunkel für den Weißabgleich.');
 if(Math.max(...m)>.97*(R.sat||1))return bad('Diese Stelle ist überbelichtet – bitte eine andere wählen.');
 const[a,b,c]=m.map((t,k)=>t*R.wb[k]),set=(k,x)=>{$('#s_'+k).value=Math.round(x)};
 set('temp',100*Math.log2(c/a));set('tint',200*Math.log2(b/Math.sqrt(a*c)));
 readP();draw()});
// ---------- Gradationskurve ----------
$('aside').insertAdjacentHTML('beforeend','<details id="cd"><summary class="wbh">Gradationskurve</summary><div class="crow"><div class="ctabs" id="ctab"><button class="on" data-i="0">RGB</button><button data-i="1" style="color:#f77">R</button><button data-i="2" style="color:#7d7">G</button><button data-i="3" style="color:#7af">B</button></div><button id="cr">Diese zurücksetzen</button></div><canvas id="cu" width="256" height="256"></canvas><div id="ch">Tippen: Punkt setzen · Ziehen: verschieben · Doppeltippen: Punkt löschen · Endpunkte gleiten am Rand entlang</div></details>');
let CP=[0,1,2,3].map(()=>[[0,0],[1,1]]),cc=0,pts=CP[0],CU=[null,null,null,null],drag=-1;
function ap(T,v){v=v<0?0:v>1?1:v;const y=v*4096,i=y>=4096?4095:y|0;return T[i]+(T[i+1]-T[i])*(y-i)}
function buildCurve(pts){
 const n=pts.length;if(pts.every(p=>Math.abs(p[0]-p[1])<1e-4))return null;
 const x=pts.map(p=>p[0]),y=pts.map(p=>p[1]),d=[],m=[];
 for(let i=0;i<n-1;i++)d[i]=(y[i+1]-y[i])/(x[i+1]-x[i]);
 m[0]=d[0];m[n-1]=d[n-2];
 for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]>0?2*d[i-1]*d[i]/(d[i-1]+d[i]):0;
 const T=new Float32Array(4097);let k=0;
 for(let i=0;i<=4096;i++){const u=i/4096;if(u<=x[0]){T[i]=y[0];continue}if(u>=x[n-1]){T[i]=y[n-1];continue}while(k<n-2&&u>x[k+1])k++;
  const h=x[k+1]-x[k],t=(u-x[k])/h,t2=t*t,t3=t2*t;
  const v=(2*t3-3*t2+1)*y[k]+(t3-2*t2+t)*h*m[k]+(-2*t3+3*t2)*y[k+1]+(t3-t2)*h*m[k+1];
  T[i]=v<0?0:v>1?1:v}
 return T}
const CVs=$('#cu');
const CPAD=.06,CK=1-2*CPAD;
function drawCurve(){const g=CVs.getContext('2d'),W=CVs.width,H=CVs.height,X=u=>(CPAD+u*CK)*W,Y=v=>(CPAD+(1-v)*CK)*H;
 g.fillStyle='#111';g.fillRect(0,0,W,H);g.strokeStyle='#2c2c2c';g.lineWidth=1;g.beginPath();
 for(let i=0;i<=4;i++){g.moveTo(X(i/4),Y(0));g.lineTo(X(i/4),Y(1));g.moveTo(X(0),Y(i/4));g.lineTo(X(1),Y(i/4))}g.stroke();
 g.strokeStyle='#444';g.beginPath();g.moveTo(X(0),Y(0));g.lineTo(X(1),Y(1));g.stroke();
 g.strokeStyle=['#e8e8e8','#f55','#5d5','#59f'][cc];g.lineWidth=1.5;g.beginPath();
 for(let i=0;i<=256;i++){const u=i/256,v=CU[cc]?CU[cc][i*16]:u;i?g.lineTo(X(u),Y(v)):g.moveTo(X(u),Y(v))}g.stroke();
 g.fillStyle='#fff';g.strokeStyle='#000';for(const p of pts){g.beginPath();g.arc(X(p[0]),Y(p[1]),5,0,7);g.fill();g.stroke()}}
function tabsUI(){document.querySelectorAll('#ctab button').forEach((b,i)=>{b.classList.toggle('on',i==cc);b.classList.toggle('mod',!!CU[i])})}
function curveChanged(){CU=CP.map(p=>buildCurve(p));tabsUI();drawCurve();cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
const cpos=e=>{const r=CVs.getBoundingClientRect();return[((e.clientX-r.left)/r.width-CPAD)/CK,1-((e.clientY-r.top)/r.height-CPAD)/CK,r]};
const cnear=(px,py,r,rad=14)=>{let b=-1,bd=rad;pts.forEach((p,i)=>{const d=Math.hypot((px-p[0])*r.width*CK,(py-p[1])*r.height*CK);if(d<bd){bd=d;b=i}});return b};
let lt=0,li=-1;
CVs.onpointerdown=e=>{
 const[px,py,r]=cpos(e),now=Date.now();let b=cnear(px,py,r,e.pointerType=='mouse'?14:28);
 if(b>0&&b<pts.length-1&&b==li&&now-lt<350){pts.splice(b,1);lt=0;li=-1;drag=-1;curveChanged();return}
 if(b<0){if(pts.length>=20)return;const x=Math.min(.99,Math.max(.01,px)),y=Math.min(1,Math.max(0,py));
  let i=pts.findIndex(p=>p[0]>x);if(i<1)return;
  if(x-pts[i-1][0]<.01||pts[i][0]-x<.01)return;
  pts.splice(i,0,[x,y]);b=i;curveChanged()}
 lt=now;li=b;drag=b;CVs.setPointerCapture(e.pointerId)};
CVs.onpointermove=e=>{if(drag<0)return;
 const[px,py]=cpos(e),last=pts.length-1,cl=(v,a,b)=>Math.min(b,Math.max(a,v));let p;
 if(drag==0){const x=cl(px,0,pts[1][0]-.01),y=cl(py,0,1);p=x>y?[x,0]:[0,y]}
 else if(drag==last){const x=cl(px,pts[last-1][0]+.01,1),y=cl(py,0,1);p=(1-x)>(1-y)?[x,1]:[1,y]}
